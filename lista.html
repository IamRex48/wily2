<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ojala te guste..</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden; /* Permite scroll vertical si la lista es larga */
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            color: white;
        }

        /* FONDO DE VIDEO (El sistema que funcionó) */
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(0.4);
            transform: scale(1.1);
        }

        /* ANIMACIÓN DE ENTRADA */
        .pixel-entry {
            opacity: 0;
            animation: pixelBurn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes pixelBurn {
            0% { opacity: 0; transform: scale(1.05); filter: brightness(3) blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1) blur(0); }
        }

        /* CONTENEDOR DE LA LISTA */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .list-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 15px;
        }

        ul {
            list-style: none;
        }

        li {
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding-left: 35px;
            position: relative;
            line-height: 1.5;
            font-weight: 400;
        }

        /* El puntito de la lista */
        li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: #fff;
            font-size: 1.2rem;
        }

        /* BOTÓN VOLVER */
        .btn-back {
            margin-top: 30px;
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            border: 1.5px solid white;
            color: white;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-back:hover {
            background: white;
            color: black;
        }

        footer {
            margin-top: auto;
            padding: 40px 0 20px 0;
            font-size: 0.6rem;
            opacity: 0.5;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .list-card { padding: 25px; }
            h1 { font-size: 1.8rem; }
            li { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="main-container pixel-entry">
   
    <div class="video-wrapper">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="walistal.mp4" type="video/mp4">
        </video>
    </div>
     
        <div class="list-card">
            <h1>Cosas en común</h1>
            
           <ul>
                <li>Ambos ibamos a tener la misma playera de fnaf jsjsj</li>
                <li>Tenemos un mismo gusto musical y manera en la que nos gusta</li>
                <li>Los 2 tenemos una mentalidad bastante similar en varias situaciones</li>
                <li>se me olvido que mas🔥</li>
            </ul>

            <div style="text-align: center;">
                <a href="index.html" class="btn-back">Volver al contador</a>
            </div>
        </div>

        <footer>
            <div>Por siempre, Para siempre<br>__ ___</div>
        </footer>
    </div>

    <script>
        // Forzar play del video
        window.addEventListener('load', () => {
            const video = document.getElementById('bgVideo');
            if(video) video.play();
        });
    </script>
</body>

</html>
