<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totoro Wallpaper</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: 'Montserrat', sans-serif;
}

/* Video fondo */


video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
    transform: scale(1.05);
}

/* Contador arriba derecha */
#contador {
    position: fixed;
    top: 20px;
    right: 25px;
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    max-width: 420px;
    text-align: right;
    line-height: 1.2;
    opacity: 0.95;
}

/* Mensaje */
#message {
    position: fixed;
    top: 95px;
    right: 25px;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    max-width: 420px;
    text-align: right;
    line-height: 1.3;
    opacity: 0.9;
}

/* Hora abajo derecha */
#hora {
    position: fixed;
    bottom: 20px;
    right: 25px;
    font-size: 1.4rem;
    letter-spacing: 2px;
    opacity: 0.85;
}

/* Mobile */
@media (max-width: 768px) {
    #contador {
        font-size: 1.2rem;
        max-width: 280px;
    }

    #hora {
        font-size: 1.1rem;
    }
}
</style>
</head>

<body>

<div class="video-wrapper">
    <video autoplay muted playsinline preload="auto" id="bgVideo">
        <source src="totoro.mp4" type="video/mp4">
    </video>
</div>

<div id="contador">Cargando…</div>
<div id="message">--16 de diciembre del 2025--</div>
<div id="hora">00:00:00</div>

<script>
/* ===== VIDEO LOOP PERFECTO (ANTI CONGELÓN) ===== */
const video = document.getElementById("bgVideo");

video.addEventListener("loadedmetadata", () => {
    video.play();
});

video.addEventListener("timeupdate", () => {
    if (video.duration && video.currentTime >= video.duration - 0.08) {
        video.currentTime = 0;
        video.play();
    }
});

/* ===== CONTADOR ===== */
function updateCounter() {
    const startDate = new Date('2025-12-16T20:10:00');
    const now = new Date();

    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();
    let hours = now.getHours() - startDate.getHours();
    let minutes = now.getMinutes() - startDate.getMinutes();
    let seconds = now.getSeconds() - startDate.getSeconds();

    if (seconds < 0) { seconds += 60; minutes--; }
    if (minutes < 0) { minutes += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }
    if (days < 0) {
        const lastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += lastMonth.getDate();
        months--;
    }
    if (months < 0) { months += 12; years--; }

    let weeks = Math.floor(days / 7);
    days %= 7;

    let result = [];
    if (years) result.push(years + (years === 1 ? " año" : " años"));
    if (months) result.push(months + (months === 1 ? " mes" : " meses"));
    if (weeks) result.push(weeks + (weeks === 1 ? " semana" : " semanas"));
    if (days) result.push(days + (days === 1 ? " día" : " días"));
    if (hours) result.push(hours + (hours === 1 ? " hora" : " horas"));
    if (minutes) result.push(minutes + " min");
    if (seconds) result.push(seconds + " seg");

    document.getElementById("contador").innerText =
        result.length ? result.join(", ") : "0 seg";
}

setInterval(updateCounter, 1000);
updateCounter();

/* ===== HORA ===== */
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("hora").innerText = `${h}:${m}:${s}`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
